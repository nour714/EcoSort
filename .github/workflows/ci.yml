name: EcoSort CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Unit, Graph & UI Audit Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        playwright install --with-deps chromium

    - name: Run ruff linter
      run: |
        ruff check .

    - name: Run Node test suite (graph & client algorithms)
      run: |
        node --test tests/*.test.js

    - name: Run Pytest unit and integration suite
      run: |
        pytest -v tests/ --ignore=tests/test_ui_audit.py

    - name: Run Playwright UI audit & E2E suite
      run: |
        pytest -v tests/test_ui_audit.py tests/test_uncertain_flow_playwright.py

  vercel-clean-runtime:
    name: Vercel Clean Runtime Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run clean venv test with api/requirements.txt ONLY
      run: |
        python -m venv .clean_venv
        . .clean_venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt pytest
        python -m pytest tests/test_vercel_clean_engine.py -v
